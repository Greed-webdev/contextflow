<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ContextFlow · проверка микрофона</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;padding:16px 14px 60px;background:#14150f;color:#e8e4d9;
       font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:#8e8a7d;font-size:13px;margin:0 0 18px}
  .row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #262718}
  .k{flex:1;min-width:0}
  .k b{display:block;font-weight:600;font-size:14px}
  .k span{display:block;color:#8e8a7d;font-size:12px;word-break:break-word}
  .v{font-size:13px;font-weight:700;white-space:nowrap;padding-top:1px}
  .yes{color:#7fbf8a}.no{color:#e0704f}.mid{color:#d8b45c}
  button{width:100%;padding:17px;margin:9px 0 0;border:0;border-radius:14px;
         background:#2c3326;color:#e8e4d9;font-size:16px;font-weight:600;font-family:inherit}
  button:active{background:#3a442f}
  button.go{background:#6f9c78;color:#12140e}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#8e8a7d;
     margin:26px 0 4px;font-weight:600}
  #log{background:#0d0e08;border-radius:12px;padding:11px;margin-top:10px;
       font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#b9c9ac;
       white-space:pre-wrap;word-break:break-word;min-height:60px;max-height:300px;overflow:auto}
  .note{background:#221f10;border-left:3px solid #d8b45c;padding:10px 12px;
        border-radius:8px;font-size:13px;color:#cfc7ad;margin-top:14px}
</style>
</head>
<body>

<h1>Проверка микрофона</h1>
<p class="sub">Открой эту страницу <b>внутри Telegram</b> и нажми кнопки по порядку.</p>

<h2>Что умеет это окружение</h2>
<div id="caps"></div>

<h2>Живые проверки</h2>
<button class="go" id="b1">1 · Спросить микрофон (getUserMedia)</button>
<button class="go" id="b2">2 · Запустить распознавание речи</button>
<button class="go" id="b3">3 · Сказать «Hello» вслух</button>
<button id="b4">Показать список голосов</button>
<button id="b5">Очистить журнал</button>

<div class="note">
  Важно: посчитай, <b>сколько раз</b> телефон показал окно «Разрешить доступ к микрофону».
  Нажми кнопку 1, потом кнопку 2 — и скажи мне, окно вылезло один раз или два.
</div>

<h2>Журнал</h2>
<div id="log">…</div>

<script>
var L = document.getElementById('log'); L.textContent = '';
function log(s){
  var t = new Date().toLocaleTimeString('ru-RU');
  L.textContent += '[' + t + '] ' + s + '\n';
  L.scrollTop = L.scrollHeight;
}
function row(name, val, hint){
  var ok = val === true, bad = val === false;
  var txt = (val === true) ? 'есть' : (val === false) ? 'НЕТ' : String(val);
  var cls = ok ? 'yes' : bad ? 'no' : 'mid';
  var d = document.createElement('div'); d.className = 'row';
  d.innerHTML = '<div class="k"><b></b><span></span></div><div class="v ' + cls + '"></div>';
  d.querySelector('b').textContent = name;
  d.querySelector('span').textContent = hint || '';
  d.querySelector('.v').textContent = txt;
  document.getElementById('caps').appendChild(d);
}

var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
row('Распознавание речи', !!SR, SR ? (window.SpeechRecognition ? 'SpeechRecognition' : 'webkitSpeechRecognition') : 'браузер Telegram его не даёт');
row('Синтез речи (озвучка)', ('speechSynthesis' in window), 'speechSynthesis');
row('Доступ к микрофону', !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia), 'getUserMedia');
row('Опрос разрешений', !!(navigator.permissions && navigator.permissions.query), 'navigator.permissions');
row('Защищённое соединение', window.isSecureContext === true, location.protocol);
row('Внутри Telegram', !!(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.platform),
    (window.Telegram && window.Telegram.WebApp) ? ('platform=' + window.Telegram.WebApp.platform + ' v' + window.Telegram.WebApp.version) : 'объект Telegram не найден');
row('Голосов для озвучки', (('speechSynthesis' in window) ? (speechSynthesis.getVoices()||[]).length : 'нет API'), 'сразу при загрузке, часто 0 — это норма');
row('Отметка в памяти', (function(){ try { return localStorage.getItem('cf_mic_ok') === '1'; } catch(e){ return 'память закрыта'; } })(), 'ключ cf_mic_ok');
row('Браузер', navigator.userAgent.length > 60 ? navigator.userAgent.slice(0,60) + '…' : navigator.userAgent, '');

if ('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = function(){
    log('голоса подгрузились: ' + (speechSynthesis.getVoices()||[]).length + ' шт.');
  };
}
if (navigator.permissions && navigator.permissions.query){
  navigator.permissions.query({name:'microphone'})
    .then(function(p){ log('состояние разрешения микрофона: ' + p.state); })
    .catch(function(e){ log('состояние разрешения узнать нельзя: ' + e.message); });
}

document.getElementById('b1').onclick = function(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ log('getUserMedia отсутствует'); return; }
  log('прошу микрофон…');
  var t0 = Date.now();
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
    log('ДАЛИ доступ за ' + (Date.now()-t0) + ' мс, дорожек: ' + st.getTracks().length);
    st.getTracks().forEach(function(t){ t.stop(); });
    log('дорожки отпущены');
    try { localStorage.setItem('cf_mic_ok','1'); log('отметка cf_mic_ok сохранена'); } catch(e){ log('память недоступна'); }
    if (navigator.permissions && navigator.permissions.query){
      navigator.permissions.query({name:'microphone'}).then(function(p){ log('теперь разрешение = ' + p.state); }).catch(function(){});
    }
  }).catch(function(e){
    log('ОТКАЗ: ' + e.name + ' — ' + e.message);
  });
};

var rec = null;
document.getElementById('b2').onclick = function(){
  if (!SR){ log('распознавания нет в этом браузере'); return; }
  if (rec){ try{ rec.abort(); }catch(e){} rec = null; log('прошлая попытка сброшена'); }
  var r;
  try { r = new SR(); } catch(e){ log('не создаётся: ' + e.message); return; }
  rec = r;
  r.lang = 'en-US'; r.interimResults = true; r.maxAlternatives = 3; r.continuous = false;
  var t0 = Date.now(), got = false;
  r.onstart      = function(){ log('старт распознавания (+' + (Date.now()-t0) + ' мс) — говори «hello»'); };
  r.onaudiostart = function(){ log('звук пошёл'); };
  r.onspeechstart= function(){ log('слышу речь'); };
  r.onresult     = function(e){
    got = true;
    var s = '';
    for (var i = e.resultIndex; i < e.results.length; i++) s += e.results[i][0].transcript;
    log('распознал: «' + s + '»');
  };
  r.onspeechend  = function(){ log('речь кончилась'); };
  r.onerror      = function(e){ log('ОШИБКА распознавания: ' + e.error); };
  r.onend        = function(){ log('распознавание закрылось' + (got ? '' : ' (ничего не услышал)')); rec = null; };
  try { r.start(); log('вызвал start()'); } catch(e){ log('start() упал: ' + e.message); }
};

document.getElementById('b3').onclick = function(){
  if (!('speechSynthesis' in window)){ log('синтеза речи нет'); return; }
  try {
    speechSynthesis.cancel();
    if (speechSynthesis.paused) speechSynthesis.resume();
    var u = new SpeechSynthesisUtterance('Hello. Nice to meet you.');
    u.lang = 'en-US'; u.rate = 0.92; u.volume = 1;
    var list = speechSynthesis.getVoices() || [];
    var v = null;
    for (var i = 0; i < list.length; i++){
      if ((list[i].lang||'').toLowerCase().indexOf('en') === 0){ v = list[i]; break; }
    }
    if (v){ u.voice = v; log('голос: ' + v.name + ' (' + v.lang + ')'); }
    else { log('английский голос не найден, говорю голосом по умолчанию'); }
    u.onstart = function(){ log('ЗВУЧИТ'); };
    u.onend   = function(){ log('договорил'); };
    u.onerror = function(e){ log('ОШИБКА озвучки: ' + (e.error || 'неизвестно')); };
    speechSynthesis.speak(u);
    log('speak() вызван; очередь=' + speechSynthesis.pending + ' говорит=' + speechSynthesis.speaking);
    setTimeout(function(){
      log('через 1 с: говорит=' + speechSynthesis.speaking + ' очередь=' + speechSynthesis.pending + ' пауза=' + speechSynthesis.paused);
    }, 1000);
  } catch(e){ log('синтез упал: ' + e.message); }
};

document.getElementById('b4').onclick = function(){
  if (!('speechSynthesis' in window)){ log('синтеза речи нет'); return; }
  var list = speechSynthesis.getVoices() || [];
  log('голосов: ' + list.length);
  for (var i = 0; i < Math.min(list.length, 25); i++) log('  · ' + list[i].name + ' [' + list[i].lang + ']');
};

document.getElementById('b5').onclick = function(){ L.textContent = ''; };

window.onerror = function(m, s, l){ log('JS-ОШИБКА: ' + m + ' (строка ' + l + ')'); };
log('страница загружена');
</script>
</body>
</html>
