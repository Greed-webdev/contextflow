</style></head><body><div class="wrap">
<h1>Эталон: разговор идёт за тобой</h1>
<p class="sub">Три сцены с ветвями (ур. 3, 6, 9). Ответь иначе — и собеседник ответит иначе. В код не внедрено.</p>

<div class="pick" id="pick"></div>

<div class="col" id="stage" style="display:none">
  <div class="chat" id="chat"></div>
  <div class="task"><b>Твой ход</b><p id="ru">—</p></div>
  <textarea id="in" placeholder="Ответь своими словами…"></textarea>
  <div class="row">
    <button onclick="D.go()">Ответить</button>
    <button class="g" onclick="D.again()">Заново</button>
  </div>
  <div class="row" style="margin-top:0">
    <button class="g" id="dunno" style="display:none" onclick="D.opts()">Не знаю</button>
  </div>

</div>
</div>

<script>
/* ================= ЯДРО (без DOM) ================= */
/* ---------- помощники ветвящихся диалогов (variant:'flow') ----------
   Перенесены из эталона демо-5: единый стоп-лист имён, белый список,
   правдоподобие, числа. Судьи узлов в lessons.js зовут их по имени —
   поэтому они объявлены глобально, как в демо. */
const norm = t => (t||'').toLowerCase().replace(/[\u2019']/g,"'").replace(/[^a-z' ]/g,' ').split(/\s+/).filter(Boolean);
const EXP={"i'm":['i','am'],"it's":['it','is'],"don't":['do','not'],"can't":['can','not'],"i've":['i','have'],
"what's":['what','is'],"i'll":['i','will'],"there's":['there','is'],"we're":['we','are'],"you're":['you','are'],
"that's":['that','is'],"doesn't":['does','not'],"isn't":['is','not'],"won't":['will','not'],
"didn't":['did','not'],"wasn't":['was','not'],"weren't":['were','not'],"haven't":['have','not'],
"hasn't":['has','not'],"hadn't":['had','not'],"couldn't":['could','not'],"shouldn't":['should','not'],
"wouldn't":['would','not'],"mustn't":['must','not'],"aren't":['are','not'],"they're":['they','are'],"i'd":['i','would']};
const expand = a => { const o=[]; a.forEach(x=>{ if(EXP[x]) o.push(...EXP[x]); else o.push(x.replace(/'/g,'')); }); return o; };
const NUM={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,
thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,
fifty:50,sixty:60,seventy:70,eighty:80,ninety:90,hundred:100};
const numOf = a => { let tot=0,cur=0,any=false; a.forEach(x=>{ if(/^\d+$/.test(x)){tot+=parseInt(x,10);any=true;return;}
  if(x in NUM){any=true;cur+=NUM[x];} }); return any?tot+cur:null; };
const has = (w,...xs)=> xs.some(x=>w.includes(x));
/* Близкое отрицание: «no/not/never/cannot» в 1–3 словах ПЕРЕД цель-словом,
   служебные пропускаются. Звать ДО позитивных проверок в каждом судье.
   «I do miss them» — не отрицание (между do и miss нет not). */
const NEG_LEAD=['no','not','never','cannot'];
const NEG_SKIP=['to','a','an','the','on','in','at','from','want','wants','have','has','had','do','does','did',
'will','would','can','could','shall','should','am','is','are','be','been','really','just','very','so','think',
'any','some','plan','plans','planning','going','intention','like','hope','live','lives','living','stay','stays','staying'];
const negatedWord=(w,i)=>{ let k=i-1,steps=0;
  while(k>=0&&steps<3){ const x=w[k];
    if(NEG_LEAD.includes(x)) return true;
    if(!NEG_SKIP.includes(x)) return false;
    k--; steps++; }
  return false; };
const isNegatedIntent=(w,targets)=>{ for(let i=0;i<w.length;i++){ if(targets.includes(w[i])&&negatedWord(w,i)) return true; } return false; };
/* Отказ от имени: «X is not my name», «that is not my real name», «I am not X».
   Звать ДО любого извлечения имени — если имя отрицается, возвращать переспрос. */
const deniesName = w => {
  for (let i=0;i<w.length-1;i++){
    if(w[i]==='is'&&w[i+1]==='not'){
      const tail=w.slice(i+2,i+6);
      if(tail.includes('name')) return true; /* X is not my (real) name */
    }
  }
  for (let i=0;i<w.length-3;i++){
    if(w[i]==='i'&&w[i+1]==='am'&&w[i+2]==='not'){
      const x=w[i+3];
      /* только уверенные имена: иначе «i am not late / not here» ложно отрицало имя */
      if(x&&NAME_OK.has(x)&&!NOT_NAME.has(x)) return true; /* I am not Petrova */
    }
  }
  return false; };
/* Имя из явного представления: «my name is X [Y]», «i am X», «i'm X», «call me X».
   Возвращает до двух слов (имя + фамилия). После «my name is» берёт даже
   стоп-слова (Hope, Will, May — живые имена); после «i am» — только белый список. */
const introNames = w => {
  for (let i=0;i<w.length;i++){
    const a=w[i], b=w[i+1];
    let strong=false, j=-1;
    if(a==='name'&&b==='is'){ strong=true; j=i+2; }
    else if(a==='call'&&b==='me'){ strong=true; j=i+2; }
    else if(a==='this'&&b==='is'){ strong=true; j=i+2; }
    else if(a==='surname'&&b==='is'){ strong=true; j=i+2; }
    else if(a==='family'&&b==='name'&&w[i+2]==='is'){ strong=true; j=i+3; }
    else if((a==='i'&&b==='am')||a==='im'){ j=(a==='im')?i+1:i+2; }
    if(j<0) continue;
    const ok=x=>x&&/^[a-z']+$/.test(x)&&x.length>=2&&x.length<=15
       &&!NEG_LEAD.includes(x)&&!NOT_NAME.has(x)&&!NUM.hasOwnProperty(x)
       &&(NAME_OK.has(x)||(strong&&!NAME_STOP.includes(x)&&!SVC.includes(x)&&looksLikeName(x)));
    if(w[j]&&NEG_LEAD.includes(w[j])) return []; /* «my name is not ...» */
    if(!ok(w[j])) continue;
    const out=[w[j]];
    if(ok(w[j+1])) out.push(w[j+1]);
    return out;
  }
  return []; };
const SVC=['a','an','the','to','of','and','my','i','you','it','in','on','at','for','with','this','that','have',
'has','can','will','would','please','me','we','they','is','am','are','be','do','does','did','not','no','yes',
'thanks','thank','goodbye','bye','see','very','much','really','sorry','right','ok','okay','sure','here',
'there','now','then','good','fine','great','nice','just','about','all','too','also','up','down','left',
'day','night','back','soon','later','again','more','some','any','lot','so','but','or','if','from','out'];
const NAME_STOP=['hi','hello','hey','good','morning','afternoon','evening','late','sorry','excuse','waiting','wait',
'leaving','looking','sir','madam','maam','mr','mrs','ms','miss','there','from','with','about','name','my','me','i',
'am','im','please','nice','to','meet','meeting','appointment','help','need','friend','lost','person','someone','just','call',
'no','not','thanks','thank','fine','nothing','bye','goodbye','see','later','today','sure','yes','yeah','have','has',
'an','a','the','for','here','what','your','can','you','may','of','course','going','home','go','it','problem','worries',
'worry','know','yet','hope','matter','room','floor','lift','ok','okay','come','coming','visit','back','now','then',
'right','left','after','before','so','but','or','and','too','also','only','very','much','really','again','soon','day',
'do','does','did','is','are','be','we','they','this','that','these','those','all','any','some','more','out','if','at',
'on','in','up','down','an','a'];
const NAME_OK=new Set(['anna','anne','ann','maria','marie','mary','kate','katie','john','jane','tom','tim','sam',
'alex','max','nick','mike','peter','paul','david','daniel','james','robert','george','helen','laura','julia',
'olivia','emma','sophie','sofia','clara','lucy','sarah','rachel','ruth','grace','faith','hope','may','june',
'rose','lily','iris','ruby','pearl','olive','daisy','amber','joy','dawn','summer','wren','eve','ivy','ada',
'mark','frank','miles','ray','will','jack','ben','matt','rob','bill','joe','leo','hugo','oscar','felix',
'masha','maria','ekaterina','katya','sasha','dasha','nastya','olga','svetlana','sveta','natasha','natalia',
'irina','ira','tatiana','tanya','lyudmila','oksana','yulia','julia','alyona','ksenia','vera','nadezhda',
'nadya','lyubov','galina','zinaida','zhanna','elizaveta','liza','margarita','rita','polina','arina','sonya',
'dmitry','dima','sergey','seryozha','andrey','alexey','lyosha','nikolay','kolya','vladimir','vova','mikhail',
'misha','evgeny','zhenya','igor','oleg','boris','artyom','timur','ruslan','vadim','lev','ivan','vanya',
'pavel','pasha','denis','egor','yaroslav','stanislav','vyacheslav','anatoly','gennady','valery','arkady',
'roman','roma','kirill','nikita','anton','maxim','stepan','fyodor','grigory','konstantin','viktor','yuri',
'petrova','ivanova','sokolova','smirnov','popov','kuznetsov','brown','smith','jones','wilson','taylor']);
const NOT_NAME=new Set(['banana','pizza','apple','orange','potato','tomato','burger','coffee','water','bread',
'cat','dog','fish','bird','horse','mouse','table','chair','door','window','book','phone','car','house','tree',
'lorem','ipsum','dolor','test','testing','asdf','asdfgh','qwerty','xyz','abc','blah','hmm','uh','um','eh',
'why','who','when','where','which','because','maybe','nothing','something','anything','everything','nobody',
'fuck','fucking','shit','damn','bitch','ass','crap','hell','idiot','stupid']);
const looksLikeName = x =>
  x.length>=2 && x.length<=15 &&
  /^[a-z']+$/.test(x) &&
  /[aeiouy]/.test(x) &&
  !/(.)\1\1/.test(x) &&
  !/[bcdfghjklmnpqrstvwxz]{4}/.test(x) &&
  !/(ing|ed|ly|tion|ness|ment)$/.test(x);
const cap = x => x.charAt(0).toUpperCase()+x.slice(1);
const pickName = (w, skip, strict)=>{
  for(let i=0;i<w.length-1;i++){
    const pair=(w[i]==='name'&&w[i+1]==='is')||(w[i]==='i'&&w[i+1]==='am')||
               (w[i]==='call'&&w[i+1]==='me')||(w[i]==='this'&&w[i+1]==='is');
    if(pair){ const x=w[i+2];
      const strong=(w[i]==='name'&&w[i+1]==='is')||(w[i]==='call'&&w[i+1]==='me')||(w[i]==='this'&&w[i+1]==='is');
      if(x&&NEG_LEAD.includes(x)) return null; /* «my name is not ...» — имя не названо */
      /* после «my name is» берём даже стоп-слова (Hope, Will, May);
         после «i am» — только белый список, иначе «i am late/here» становилось именем */
      if(x&&!NOT_NAME.has(x)&&!NUM.hasOwnProperty(x)&&
         (NAME_OK.has(x)||(strong&&!NAME_STOP.includes(x)&&looksLikeName(x)))) return cap(x); }
  }
  const s=new Set([...SVC,...skip]);
  const c=w.find(x=>{
    if(s.has(x)||NUM.hasOwnProperty(x)||NOT_NAME.has(x)) return false;
    if(NAME_OK.has(x)) return true;
    return strict ? false : looksLikeName(x);
  });
  return c ? cap(c) : null;
};
const introduced = w => {
  for(let i=0;i<w.length-1;i++){
    if(w[i]==='name'&&w[i+1]==='is') return true;
    if(w[i]==='i'&&w[i+1]==='am') return true;
    if(w[i]==='call'&&w[i+1]==='me') return true;
    if(w[i]==='this'&&w[i+1]==='is') return true;
  }
  return false;
};
const sigWords = (w, extra)=>{
  const ex = extra || [];
  return w.filter(x=> x.length>1 && !SVC.includes(x) && !ex.includes(x));
};

/* ============ СЦЕНА 1 · ур.3 «Первое приветствие» (офис) — живая логика ============ */
const S1 = { title:'Первое приветствие · ур. 3', start:'n0',
        intro:'Ты заходишь в офис. Человек за стойкой поднимает голову.',
        opener:{them:'Hello! Can I help you?', ru:'Здравствуйте! Чем могу помочь?'},
        nodes:{
      n0:{ task:'Поздоровайся, представься и скажи, зачем пришёл (например: привет, я Анна, у меня встреча).', best:'Hi, my name is Anna. I have a meeting.',
        judge(w,mem){
          if(deniesName(w)) return {huh:1}; /* «Anna is not my name» — переспрос */
          let lim=w.length; ['with','see'].forEach(k=>{ const i=w.indexOf(k); if(i!==-1&&i<lim) lim=i; });
          const nm=pickName(w.slice(0,lim),NAME_STOP,!introduced(w));
          const meeting=has(w,'meeting','appointment');
          /* отрицание = отказ, только если оно НЕ часть вежливого оборота
             (no problem/no worries/no thanks/not late/not sure/do not know/not yet)
             и стоит рядом с делом (meeting/appointment) или фразой ухода. */
          const SOFT=['problem','worries','worry','late','sure','know','yet','matter'];
          let neg=false;
          w.forEach((x,i)=>{ if(x==='no'||x==='not'){
            const around=w.slice(Math.max(0,i-2),i+3).some(y=>SOFT.includes(y));
            if(!around) neg=true; } });
          if(meeting&&neg) return {br:'leave'};
          if(!meeting&&(neg||has(w,'leaving','going','go','home','bye','goodbye','nothing')||(has(w,'just')&&has(w,'looking')))) return {br:'leave'};
          if(nm) mem.name=nm;
          if(meeting) return nm?{br:'meet_full'}:{br:'meet_noname'};
          if((has(w,'name')&&!(has(w,'my')&&has(w,'is')))||has(w,'call')) return nm?{br:'fix'}:{br:'hi'};
          if(has(w,'friend','wait','waiting','lost','help','need','someone','person','find')) return {br:'help'};
          if(nm) return {br:'greet'};
          if(has(w,'hi','hello','hey','good','morning')) return {br:'hi'};
          if(has(w,'yes','yeah','sure','ok','okay','maybe','am','is','have')) return {br:'ask'};
          return {huh:1}; },
        tr:{
          meet_full:{them:'Nice to meet you, {name}. The meeting is in room 204, second floor, on the left.',ruThem:'Приятно познакомиться, {name}. Встреча — кабинет 204, второй этаж, слева.',next:'floor'},
          meet_noname:{them:'Of course. What is your name, please?',ruThem:'Конечно. Ваше имя, пожалуйста?',next:'name1'},
          leave:{them:'No problem. I am here if you need anything. Have a nice day!',ruThem:'Без проблем. Я здесь, если что-то понадобится. Хорошего дня!',next:'bye'},
          fix:{them:'Nice to meet you, {name}! Are you here for the meeting?',ruThem:'Приятно познакомиться, {name}! Вы на встречу?',note:'My name is Anna.',next:'meet'},
          greet:{them:'Nice to meet you, {name}. Are you here for the meeting?',ruThem:'Приятно познакомиться, {name}. Вы на встречу?',next:'meet'},
          hi:{them:'Hello! What is your name, please?',ruThem:'Здравствуйте! Как вас зовут?',next:'name0'},
          help:{them:'I see. Take a seat, please. I will be with you in a minute.',ruThem:'Ясно. Присядьте, пожалуйста. Я подойду через минуту.',next:'wait'},
          ask:{them:'What can I do for you?',ruThem:'Чем я могу вам помочь?',next:'reason'} } },
      name0:{ task:'Скажи, как тебя зовут (например: меня зовут Анна).', best:'My name is Anna.',
        judge(w,mem){ if(deniesName(w)) return {huh:1}; /* «Anna is not my name» — переспрос */
          const nm=pickName(w,NAME_STOP,false); if(nm) mem.name=nm;
          if(nm) return {br:'ok'}; return {huh:1}; },
        tr:{ ok:{them:'Nice to meet you, {name}. Are you here for the meeting?',ruThem:'Приятно познакомиться, {name}. Вы на встречу?',next:'meet'} } },
      name1:{ task:'Скажи, как тебя зовут (например: меня зовут Анна).', best:'My name is Anna.',
        judge(w,mem){ if(deniesName(w)) return {huh:1}; /* «Anna is not my name» — переспрос */
          const nm=pickName(w,NAME_STOP,false); if(nm) mem.name=nm;
          if(nm) return {br:'ok'}; return {huh:1}; },
        tr:{ ok:{them:'Nice to meet you, {name}. The meeting is in room 204, second floor, on the left.',ruThem:'Приятно познакомиться, {name}. Встреча — кабинет 204, второй этаж, слева.',next:'floor'} } },
      meet:{ task:'Ответь, идёшь ли ты на встречу (например: да, я на встречу).', best:'Yes, I am here for the meeting.',
        judge(w){ const neg=has(w,'no','not','nope','never');
          /* решение: «нет» на прямой вопрос — повод уточнить «чем помочь?», а не выпроводить
             (тренажёр: лишняя реплика = практика; админ в жизни уточнит). Мусор — честный huh. */
          if(isNegatedIntent(w,['home','leave','leaving','going','go'])) return {br:'ask'}; /* «не иду домой» — не уход */
          if(isNegatedIntent(w,['meeting','meet','appointment'])) return {br:'ask'};        /* «нет встречи» — уточнить */
          if(!neg&&has(w,'yes','yeah','sure','meeting','meet','appointment','course','right','correct','exactly')) return {br:'meet'};
          if(has(w,'home','leave','leaving','going','go','bye','later','nothing')) return {br:'home'};
          if(has(w,'help','lost','wait','waiting','friend','someone','person','look','find','another','wrong','just')) return {br:'other'};
          if(neg||has(w,'what','why','sorry','pardon','repeat','again','know','understand')) return {br:'ask'};
          return {huh:1}; },
        tr:{ meet:{them:'Great. The meeting is in room 204, second floor, on the left.',ruThem:'Отлично. Встреча — кабинет 204, второй этаж, слева.',next:'floor'},
             home:{them:'Oh, I see. Take care, then!',ruThem:'А, понял. Тогда удачи!',next:'byehome'},
             other:{them:'I see. Take a seat - I will find the right person for you.',ruThem:'Ясно. Присядьте - я найду, кто вам нужен.',next:'wait'},
             ask:{them:'What can I do for you?',ruThem:'Чем я могу вам помочь?',next:'reason'} } },
      reason:{ task:'Ответь, зачем пришёл (например: я на встречу / жду друга / просто зашёл).', best:'I am here for the meeting.',
        judge(w){ if(has(w,'meeting','meet','appointment')&&!has(w,'no','not')) return {br:'meet'};
          if(isNegatedIntent(w,['home','leave','going','go'])) return {huh:1}; /* «не иду домой» — не уход */

    document.getElementById('in').disabled=false;
    document.querySelector('.row button').disabled=false;
    D.step(); },
  step(){
    const n=D.scene.nodes[D.at];
    document.getElementById('ru').textContent = n.task;
    document.querySelector('.row button').disabled=false;
    document.getElementById('in').disabled=false;
    document.getElementById('dunno').style.display='';
    document.getElementById('out').innerHTML='';
    if(D._hint){ document.getElementById('out').innerHTML=`<div class="hint">Правильно говорить: «${D._hint}».</div>`; }
  },
  bub(who,en,ru){ const c=document.getElementById('chat');
    [...c.children].forEach(x=>x.classList.add('old'));
    const b=document.createElement('div'); b.className='bub '+who;
    b.innerHTML=en+(ru?`<span class="tr">${ru}</span>`:'');
    c.appendChild(b); c.scrollTop=c.scrollHeight; },
  go(){
    const n=D.scene.nodes[D.at];
    const said=document.getElementById('in').value.trim();
    if(!said) return;
    const w=expand(norm(said));
    D.mem._digits=(said.match(/\d+/g)||[]); D.mem._raw=said;
    let res;
    if(!w.length && !D.mem._digits.length){ res={huh:1, note:/[а-яё]/i.test(said)?'Похоже на русский — попробуй по-английски.':'Пусто.'}; }
    else res=n.judge(w,D.mem);
    document.getElementById('in').value='';
    if(res.huh){
      D.tries++;
      D.bub('you',said,'');
      const out=document.getElementById('out');
      if(D.tries>=2){
        document.getElementById('dunno').style.display='none';
        out.innerHTML=`<div class="v"><b class="a">Собеседник не понял.</b><ul><li>Скажи, например: <b>${n.best}</b></li></ul></div>`;
        D.bub('them','Sorry, I did not understand.','Простите, я не понял.');
        const b=document.createElement('button'); b.className='g'; b.textContent='Дальше';
        b.onclick=()=>{ const w2=expand(norm(n.best)); D.branch(n,n.judge(w2,D.mem)); };
        const row=document.createElement('div'); row.className='row'; row.appendChild(b);
        out.appendChild(row);
        return;
      }
      out.innerHTML=`<div class="v"><b class="a">Собеседник не понял.</b><ul><li>Скажи иначе — или жми «Не знаю».</li></ul></div>`;
      D.bub('them','Sorry, I did not understand. Could you say it again?','Простите, не понял. Повторите, пожалуйста.');
      const b=document.createElement('button'); b.className='g'; b.textContent='Исправить ответ';
      b.onclick=()=>{ b.remove(); out.innerHTML=''; document.getElementById('in').disabled=false;
        document.querySelector('.row button').disabled=false; d.style.display=''; };
      document.querySelector('.row button').disabled=true; document.getElementById('in').disabled=true;
      out.appendChild(b);
      return;
    }
    D.tries=0;
    D.bub('you',said,'');
    D.branch(n,res);
  },
  branch(n,res){
    const tr=n.tr[res.br];
    const out=document.getElementById('out');
    D._hint=(tr&&tr.note)||null;
    const note=D._hint?`<div class="hint">Правильно говорить: «${D._hint}».</div>`:'';
    out.innerHTML='<div class="v"><b class="g">Тебя поняли.</b></div>'+note;
    const d=document.getElementById('dunno'); d.style.display='none';
    document.querySelector('.row button').disabled=true; document.getElementById('in').disabled=true;
    setTimeout(()=>{
      if(!tr){ D.end(); return; }
      D.bub('them', fmt(tr.them), fmt(tr.ruThem));
      if(!tr.next){ D.end(); return; }
      D.at=tr.next; D.step();
    }, 700);
  },
  opts(){
    const n=D.scene.nodes[D.at];
    document.getElementById('dunno').style.display='none';
    const out=document.getElementById('out');
    out.innerHTML='<div class="v"><b class="a">Как сказать</b></div>';
    const row=document.createElement('div'); row.className='row';
    const b=document.createElement('button'); b.className='g'; b.textContent=n.best;
    b.onclick=()=>{ row.remove(); const w=expand(norm(n.best)); D.bub('you',n.best,''); D.branch(n,n.judge(w,D.mem)); };
    row.appendChild(b); out.appendChild(row);
  },
  end(){
    document.getElementById('ru').textContent='—';
    const d=document.getElementById('dunno'); d.style.display='none';
    document.querySelector('.row button').disabled=true;
    document.getElementById('in').disabled=true;
    const out=document.getElementById('out');
    out.innerHTML=`<div class="note-end">Сцена завершена.</div>
      <div class="v"><ul><li>Пройди ещё раз с другим ответом — собеседник среагирует иначе.</li></ul></div>`;
  }
};
(function init(){
  const pick=document.getElementById('pick');
  Object.keys(SCENES).forEach(id=>{
    const b=document.createElement('button'); b.dataset.id=id; b.textContent=SCENES[id].title;
    b.onclick=()=>D.open(id); pick.appendChild(b);
  });
  D.scene=S1; D.open('s1');
})();
</script></body></html>
