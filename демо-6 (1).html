<h1>Партия 2: разговор идёт за тобой</h1>
<p class="sub">Три сцены с ветвями (ур. 13, 19, 23). Ответь иначе — и собеседник ответит иначе. Сначала проверь тут — потом в приложение.</p>

<div class="pick" id="pick"></div>

<div class="col" id="stage" style="display:none">
  <div class="chat" id="chat"></div>
  <div class="task"><b>Твой ход</b><p id="ru">—</p></div>
  <textarea id="in" placeholder="Ответь своими словами…"></textarea>
  <div class="row">
    <button onclick="D.go()">Ответить</button>
    <button class="g" onclick="D.again()">Заново</button>
  </div>
  <div class="row" style="margin-top:0">
    <button class="g" id="dunno" style="display:none" onclick="D.opts()">Не знаю — покажи, как сказать</button>
  </div>
  <div id="out"></div>
</div>
</div>

<script>
/* ================= ЯДРО (без DOM) ================= */
const norm = t => (t||'').toLowerCase().replace(/[\u2019']/g,"'").replace(/[^a-z' ]/g,' ').split(/\s+/).filter(Boolean);
const EXP={"i'm":['i','am'],"it's":['it','is'],"don't":['do','not'],"can't":['can','not'],"i've":['i','have'],
"what's":['what','is'],"i'll":['i','will'],"there's":['there','is'],"we're":['we','are'],"you're":['you','are'],
"that's":['that','is'],"doesn't":['does','not'],"isn't":['is','not'],"won't":['will','not']};
const expand = a => { const o=[]; a.forEach(x=>{ if(EXP[x]) o.push(...EXP[x]); else o.push(x.replace(/'/g,'')); }); return o; };
const NUM={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,
thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,
fifty:50,sixty:60,seventy:70,eighty:80,ninety:90,hundred:100};
const numOf = a => { let tot=0,cur=0,any=false; a.forEach(x=>{ if(/^\d+$/.test(x)){tot+=parseInt(x,10);any=true;return;}
  if(x in NUM){any=true;cur+=NUM[x];} }); return any?tot+cur:null; };
const has = (w,...xs)=> xs.some(x=>w.includes(x));
const SVC=['a','an','the','to','of','and','my','i','you','it','in','on','at','for','with','this','that','have',
'has','can','will','would','please','me','we','they','is','am','are','be','do','does','did','not','no','yes',
'thanks','thank','goodbye','bye','see','very','much','really','sorry','right','ok','okay','sure','here',
'there','now','then','good','fine','great','nice','just','about','all','too','also','up','down','left',
'day','night','back','soon','later','again','more','some','any','lot','so','but','or','if','from','out'];
/* Единый стоп-лист: эти слова никогда не бывают именем игрока.
   Раньше список жил внутри одного узла — баг с «Late/Sir/Excuse» возвращался в других. */
const NAME_STOP=['hi','hello','hey','good','morning','afternoon','evening','late','sorry','excuse','waiting','wait',
'leaving','looking','sir','madam','maam','mr','mrs','ms','miss','there','from','with','about','name','my','me','i',
'am','im','please','nice','to','meet','meeting','appointment','help','need','friend','lost','person','someone','just','call',
'no','not','thanks','thank','fine','nothing','bye','goodbye','see','later','today','sure','yes','yeah','have','has',
'an','a','the','for','here','what','your','can','you','may','of','course','going','home','go','it','problem','worries',
'worry','know','yet','hope','matter','room','floor','lift','ok','okay','come','coming','visit','back','now','then',
'right','left','after','before','so','but','or','and','too','also','only','very','much','really','again','soon','day',
'do','does','did','is','are','be','we','they','this','that','these','those','all','any','some','more','out','if','at',
'on','in','up','down','an','a'];
/* --- имя: белый список + правдоподобность, а не только чёрный список ---
   Раньше именем считалось любое слово, которого нет в NAME_STOP:
   «banana», «pizza», «asdfgh», мат — всё проходило как имя. */
const NAME_OK=new Set(['anna','anne','ann','maria','marie','mary','kate','katie','john','jane','tom','tim','sam',
'alex','max','nick','mike','peter','paul','david','daniel','james','robert','george','helen','laura','julia',
'olivia','emma','sophie','sofia','clara','lucy','sarah','rachel','ruth','grace','faith','hope','may','june',
'rose','lily','iris','ruby','pearl','olive','daisy','amber','joy','dawn','summer','wren','eve','ivy','ada',
'mark','frank','miles','ray','will','jack','ben','matt','rob','bill','joe','leo','hugo','oscar','felix',
'masha','maria','ekaterina','katya','sasha','dasha','nastya','olga','svetlana','sveta','natasha','natalia',
'irina','ira','tatiana','tanya','lyudmila','oksana','yulia','julia','alyona','ksenia','vera','nadezhda',
'nadya','lyubov','galina','zinaida','zhanna','elizaveta','liza','margarita','rita','polina','arina','sonya',
'dmitry','dima','sergey','seryozha','andrey','alexey','lyosha','nikolay','kolya','vladimir','vova','mikhail',
'misha','evgeny','zhenya','igor','oleg','boris','artyom','timur','ruslan','vadim','lev','ivan','vanya',
'pavel','pasha','denis','egor','yaroslav','stanislav','vyacheslav','anatoly','gennady','valery','arkady',
'roman','roma','kirill','nikita','anton','maxim','stepan','fyodor','grigory','konstantin','viktor','yuri',
'petrova','ivanova','sokolova','smirnov','popov','kuznetsov','brown','smith','jones','wilson','taylor']);

/* явный мусор, который люди вбивают при проверке «а что будет» */
const NOT_NAME=new Set(['banana','pizza','apple','orange','potato','tomato','burger','coffee','water','bread',
'cat','dog','fish','bird','horse','mouse','table','chair','door','window','book','phone','car','house','tree',
'lorem','ipsum','dolor','test','testing','asdf','asdfgh','qwerty','xyz','abc','blah','hmm','uh','um','eh',
'why','who','when','where','which','because','maybe','nothing','something','anything','everything','nobody',
'fuck','fucking','shit','damn','bitch','ass','crap','hell','idiot','stupid']);

const looksLikeName = x =>
  x.length>=2 && x.length<=15 &&
  /^[a-z']+$/.test(x) &&
  /[aeiouy]/.test(x) &&                 // без гласной — не слово
  !/(.)\1\1/.test(x) &&                // ааа, ррр
  !/[bcdfghjklmnpqrstvwxz]{4}/.test(x) && // asdfgh, qwrtp
  !/(ing|ed|ly|tion|ness|ment)$/.test(x); // waiting, leaving, quickly

/* strict=true — слово обязано быть в белом списке (голый ввод без «my name is»)
   strict=false — достаточно правдоподобности (игрок явно представился) */
const cap = x => x.charAt(0).toUpperCase()+x.slice(1);
const pickName = (w, skip, strict)=>{
  /* 1) слово сразу после «my name is» / «i am» / «call me» / «this is».
     Так Hope, Will, May, Grace распознаются, хотя они же служебные слова,
     а «I hope I am not late» именем не становится. */
  for(let i=0;i<w.length-1;i++){
    const pair=(w[i]==='name'&&w[i+1]==='is')||(w[i]==='i'&&w[i+1]==='am')||
               (w[i]==='call'&&w[i+1]==='me')||(w[i]==='this'&&w[i+1]==='is');
    if(pair){ const x=w[i+2];
      if(x&&!NOT_NAME.has(x)&&!NUM.hasOwnProperty(x)&&
         (NAME_OK.has(x)||(!SVC.includes(x)&&!NAME_STOP.includes(x)&&looksLikeName(x)))) return cap(x); }
  }
  /* 2) обычный поиск */
  const s=new Set([...SVC,...skip]);
  const c=w.find(x=>{
    if(s.has(x)||NUM.hasOwnProperty(x)||NOT_NAME.has(x)) return false;
    if(NAME_OK.has(x)) return true;
    return strict ? false : looksLikeName(x);
  });
  return c ? cap(c) : null;
};
/* игрок явно представляется: «my name is X», «i am X», «call me X», «this is X» */
const introduced = w => {
  for(let i=0;i<w.length-1;i++){
    if(w[i]==='name'&&w[i+1]==='is') return true;
    if(w[i]==='i'&&w[i+1]==='am') return true;
    if(w[i]==='call'&&w[i+1]==='me') return true;
    if(w[i]==='this'&&w[i+1]==='is') return true;
  }
  return false;
};
const sigWords = (w, extra)=>{
  const ex = extra || [];
  return w.filter(x=> x.length>1 && !SVC.includes(x) && !ex.includes(x));
};
/* --- помощники судей ветвящихся диалогов (партия 2+) --- */
const DAY_IN = w => {
  const D=['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
  for (const x of w) if (D.includes(x)) return x;
  return null;
};
const FLOWNUM = (w, digits) => {
  if (digits && digits.length === 1) return digits[0];
  if (digits && digits.length > 1) return null;      // несколько чисел — неоднозначно
  const seq = [];
  w.forEach(x => { if (x in NUM) seq.push(x); });    // слова-числительные по порядку
  if (!seq.length) return null;
  let cur = 0;
  for (const x of seq) {
    const v = NUM[x];
    if (x === 'hundred' || x === 'thousand'){ cur = cur ? cur * v : v; }
    else if (cur === 0) cur = v;
    else if (cur % 10 === 0 && cur < 100 && v < 10) cur += v;      // twenty five = 25
    else if (cur >= 100 && v < 100) cur += v;                      // one hundred (and) five = 105
    else return null;                                              // two and three — неоднозначно
  }
  return cur;
};
/* Отрицание липнет к ближайшему содержательному слову справа.
   «not black, red» -> отрицается black, red выбран. «no red» -> red НЕ выбран. */
const NEGLEAD=['no','not','never','without'];
const NEGPASS=['to','a','an','the','and','or','any','it','this','that','one','really','just','very','so',
'want','like','need','take','have','get','choose','prefer','buy','think','do','does','did',
'would','will','can','could','should','am','is','are','be'];
const negatedAt = (w,i) => {
  for (let j=0;j<w.length;j++){
    if(!NEGLEAD.includes(w[j])) continue;
    let k=j+1;
    while(k<w.length && NEGPASS.includes(w[k])) k++;   // сквозь «want/to/do…» к мишени
    if(k===i) return true;
  }
  return false;
};
const chose = (w,...xs) => { for (const x of xs){ const i=w.indexOf(x); if(i>-1 && !negatedAt(w,i)) return true; } return false; };

/* ============ S1 · «Назвать количество» (партия 2) ============ */
const S1 = { title:'Назвать количество · ур. 13',
  intro:'Продавец взвешивает и уточняет.',
    start:'count',
    opener:{them:'How many do you need?', ru:'Сколько вам нужно?'},
    nodes:{
    count:{ task:'Скажи, сколько нужно: пять.', best:'Five, please.',
    judge(w,mem){ const d=(mem._digits||[]).map(Number); const n=FLOWNUM(w,d);
    if(n===5) return {br:'five'};
    const nums = d.length>0 || w.some(x=>x in NUM);
    if(nums && n===0) return {huh:1};          // ноль — не количество
    if(has(w,'much','cost','price','expensive')) return {br:'price'};
    if(has(w,'bye','goodbye','leave','leaving')||(has(w,'no')&&has(w,'thanks','thank'))||(has(w,'just')&&has(w,'looking'))) return {br:'bye'};
    if(nums){ mem._lc=(mem._lc||0)+1;           // третий круг с числом — уступаем
      if(mem._lc>=3) return {br:'giveup'};
      return n!==null ? {br:'othernum'} : {br:'many'}; }
    return {huh:1}; },
    tr:{ five:{them:'Five. That will be twelve euros.',ruThem:'Пять. С вас двенадцать евро.',next:'twelve'},
      othernum:{them:'We sell these in packs of five. Five, right?',ruThem:'Мы продаём их по пять штук. Пять, верно?',next:'count'},
      many:{them:'Sorry, how many exactly? One number, please.',ruThem:'Простите, сколько именно? Одно число, пожалуйста.',next:'count'},
      giveup:{them:'Ok, let us do five then.',ruThem:'Хорошо, тогда берём пять.',next:'twelve'},
      price:{them:'They are two euros each.',ruThem:'По два евро за штуку.',next:'count'},
      bye:{them:'No problem. Have a nice day!',ruThem:'Без проблем. Хорошего дня!',next:'bye'} } },
    twelve:{ task:'Уточни: двенадцать?', best:'Twelve? Not twenty?',
    judge(w,mem){ const d=(mem._digits||[]).map(Number);
    const is12 = chose(w,'twelve') || d.includes(12);
    const is20 = chose(w,'twenty') || d.includes(20);
    if(is12 && !is20) return {br:'ok'};
    if(is20 && !is12){ mem._lt=(mem._lt||0)+1;    // третий круг «twenty» — уступаем
      if(mem._lt>=3) return {br:'giveup'};
      return {br:'twenty'}; }
    if(has(w,'sorry','pardon','what','again','repeat')) return {br:'again'};
    return {huh:1}; },
    tr:{ ok:{them:'Yes, twelve. Not twenty.',ruThem:'Да, двенадцать. Не двадцать.',next:'agree'},
      twenty:{them:'No, twelve. One two.',ruThem:'Нет, двенадцать. Один-два.',next:'twelve'},
      giveup:{them:'Ok, it is twelve euros.',ruThem:'Хорошо, двенадцать евро.',next:'agree'},
      again:{them:'Twelve euros. Not twenty.',ruThem:'Двенадцать евро. Не двадцать.',next:'twelve'} } },
    agree:{ task:'Согласись и поблагодари.', best:'Right, here you are. Thank you.',
    judge(w){ const th=has(w,'thanks','thank'), ok=has(w,'right','ok','okay','yes','sure','here','fine','take');
    if(th||ok) return {br:'ok'}; return {huh:1}; },
    tr:{ ok:{them:'Thank you. Anything else today?',ruThem:'Спасибо. Что-нибудь ещё?',next:'extra'} } },
    extra:{ task:'Попроси два хлеба.', best:'Two loaves of bread, please.',
    judge(w,mem){ const n=FLOWNUM(w,(mem._digits||[]).map(Number));
    const bread=has(w,'bread','loaf','loaves');
    if(bread&&n===2) return {br:'two'};
    if(bread) return {br:'loaves'};
    if(has(w,'no','nothing','all','that')) return {br:'done'};
    return {huh:1}; },
    tr:{ two:{them:'Two loaves of bread. That is three more euros.',ruThem:'Два хлеба. Ещё три евро.',next:'pay'},
      loaves:{them:'How many loaves?',ruThem:'Сколько буханок?',next:'extra'},
      done:{them:'Ok. That is twelve euros, please.',ruThem:'Хорошо. С вас двенадцать евро.',next:'pay'} } },
    pay:{ task:'Скажи, что платишь наличными.', best:'I will pay in cash.',
    judge(w){ if(has(w,'card')) return {br:'card'};
    if(has(w,'cash','notes','money')) return {br:'cash'}; return {huh:1}; },
    tr:{ cash:{them:'Here is your change.',ruThem:'Вот ваша сдача.',next:'change'},
      card:{them:'Sorry, we only take cash today.',ruThem:'Извините, сегодня только наличные.',next:'pay'} } },
    change:{ task:'Проверь сдачу и поблагодари.', best:'Thank you. That is right.',
    judge(w){ const pos=['right','ok','okay','fine','correct','good'];
    const negHit = pos.some(x=>{ const i=w.indexOf(x); return i>-1 && negatedAt(w,i); });
    if(has(w,'wrong','short','mistake','incorrect')||negHit) return {br:'recheck'};
    if(w[0]==='no'||w[0]==='not') return {br:'recheck'};        // голое «no» — сдачу не принимает
    if(has(w,'thanks','thank')||pos.some(x=>w.includes(x))) return {br:'ok'};
    return {huh:1}; },
    tr:{ ok:{them:'You are welcome. Have a nice day!',ruThem:'Пожалуйста. Хорошего дня!',next:null},
      recheck:{them:'Sorry. Let me count again. Here you are.',ruThem:'Извините. Пересчитаю. Вот, пожалуйста.',next:'change'} } },
    bye:{ task:'Попрощайся.', best:'Thank you. Goodbye!',
    judge(w){ if(has(w,'bye','goodbye','thanks','thank','see','later','day')) return {br:'ok'}; return {huh:1}; },
    tr:{ ok:{them:'Goodbye!',ruThem:'До свидания!',next:null} } }
    }
};

/* ============ S2 · «Выбрать цвет» (партия 2) ============ */
const S2 = { title:'Выбрать цвет · ур. 19',
  intro:'Продавец показывает два варианта.',
    start:'pick',
    opener:{them:'We have it in red and in black.', ru:'Есть красный и чёрный.'},
    nodes:{
    pick:{ task:'Скажи, что предпочитаешь чёрный.', best:'I prefer the black one.',
    judge(w,mem){ const b=chose(w,'black'), r=chose(w,'red');
    if(has(w,'much','cost','price','expensive')) return {br:'price'};
    if(b&&r) return {br:'both'};
    if(b) return {br:'black'};
    if(r) return {br:'red'};
    if(has(w,'blue','green','white','grey','gray','yellow','brown')){ mem._lp=(mem._lp||0)+1;
      if(mem._lp>=3) return {br:'order'};
      return {br:'colour'}; }
    if(has(w,'red','black','colour','color')) return {br:'ask'};   // цвет назван с отрицанием — переспрос
    if(has(w,'bye','goodbye','leave','leaving')||(has(w,'no')&&has(w,'thanks','thank'))||(has(w,'just')&&has(w,'looking'))) return {br:'bye'};
    return {huh:1}; },
    tr:{ black:{them:'Black is a good choice. What size do you need?',ruThem:'Чёрный — хороший выбор. Какой размер нужен?',next:'size'},
      red:{them:'Ok, the red one. What size do you need?',ruThem:'Хорошо, красный. Какой размер?',next:'size'},
      both:{them:'Ok, one in each colour. What size do you need?',ruThem:'Хорошо, по одному каждого цвета. Какой размер?',next:'size'},
      ask:{them:'Ok. Would you like the red one or the black one?',ruThem:'Так. Вам красный или чёрный?',next:'pick'},
      price:{them:'They are the same price.',ruThem:'Они по одной цене.',next:'pick'},
      colour:{them:'Sorry, we only have red and black.',ruThem:'Извините, есть только красный и чёрный.',next:'pick'},
      order:{them:'We do not have that colour in stock, but I can order it. What size do you need?',ruThem:'Этого цвета нет в наличии, но могу заказать. Какой размер?',next:'size'},
      bye:{them:'No problem. Have a nice day!',ruThem:'Без проблем. Хорошего дня!',next:'bye'} } },
    size:{ task:'Скажи: маленький.', best:'A small one, please.',
    judge(w){ if(chose(w,'small','little')) return {br:'s'};
    if(chose(w,'medium')) return {br:'m'};
    if(chose(w,'large','big')) return {br:'l'};
    if(has(w,'small','little','medium','large','big')) return {br:'ask'};
    return {huh:1}; },
    tr:{ s:{them:'A small one. Here you are.',ruThem:'Маленький. Пожалуйста.',next:'thx'},
      m:{them:'A medium one. Here you are.',ruThem:'Средний. Пожалуйста.',next:'thx'},
      l:{them:'A large one. Here you are.',ruThem:'Большой. Пожалуйста.',next:'thx'},
      ask:{them:'What size — small, medium or large?',ruThem:'Какой размер — маленький, средний или большой?',next:'size'} } },
    thx:{ task:'Поблагодари.', best:'Thank you very much.',
    judge(w){ if(has(w,'thanks','thank','cheers')) return {br:'ok'}; return {huh:1}; },
    tr:{ ok:{them:'You are welcome. Anything else?',ruThem:'Пожалуйста. Что-нибудь ещё?',next:'rest'} } },
    rest:{ task:'Скажи, что это всё.', best:'No, that is all, thank you.',
    judge(w){ const extra=has(w,'more','another','also','need','want');
    if(extra) return {br:'more'};
    if(has(w,'no','nothing')||has(w,'all','everything','that')) return {br:'all'};
    return {huh:1}; },
    tr:{ all:{them:'That is fine. Cash or card?',ruThem:'Хорошо. Наличные или карта?',next:'paym'},
      more:{them:'Of course. What else do you need?',ruThem:'Конечно. Что ещё вам нужно?',next:'pick'} } },
    paym:{ task:'Скажи: картой.', best:'By card, please.',
    judge(w){ if(has(w,'card')) return {br:'card'};
    if(has(w,'cash','money','notes')) return {br:'cash'}; return {huh:1}; },
    tr:{ card:{them:'Thank you. Have a good day!',ruThem:'Спасибо. Хорошего дня!',next:'wish'},
      cash:{them:'Thank you. Here is your change. Have a good day!',ruThem:'Спасибо. Вот сдача. Хорошего дня!',next:'wish'} } },
    wish:{ task:'Пожелай того же.', best:'Thanks, you too!',
    judge(w){ if(has(w,'too','likewise','same')) return {br:'ok'};
    if(has(w,'bye','goodbye','see','later','day')) return {br:'bye'}; return {huh:1}; },
    tr:{ ok:{them:'Goodbye!',ruThem:'До свидания!',next:null},
      bye:{them:'Goodbye!',ruThem:'До свидания!',next:null} } },
    bye:{ task:'Попрощайся.', best:'Thank you. Goodbye!',
    judge(w){ if(has(w,'bye','goodbye','thanks','thank','see','later','day')) return {br:'ok'}; return {huh:1}; },
    tr:{ ok:{them:'Goodbye! Have a nice day!',ruThem:'До свидания! Хорошего дня!',next:null} } }
    }
};

/* ============ S3 · «Назначить день» (партия 2) ============ */
const S3 = { title:'Назначить день · ур. 23',
  intro:'Коллега подбирает день для встречи.',
    start:'askday',
    opener:{them:'Can we meet this week?', ru:'Можем встретиться на этой неделе?'},
    nodes:{
    askday:{ task:'Спроси, какой день.', best:'Sure. Which day?',
    judge(w,mem){ const d=DAY_IN(w);
    if(d){ mem.day=d; return {br:'direct'}; }
    if(has(w,'when','which')&&has(w,'day')) return {br:'ask'};
    if(has(w,'yes','ok','okay','sure','fine','great')) return {br:'ok'};
    if(has(w,'no','not','busy')) return {br:'busy'};
    return {huh:1}; },
    tr:{ ask:{them:'How about Wednesday?',ruThem:'Как насчёт среды?',next:'wed'},
      ok:{them:'Great. How about Wednesday?',ruThem:'Отлично. Как насчёт среды?',next:'wed'},
      busy:{them:'No problem. When is a good day for you?',ruThem:'Без проблем. Когда вам удобно?',next:'day'},
      direct:{them:'Ok, {day} then.',ruThem:'Хорошо, тогда {day}.',next:'conf'} } },
    day:{ task:'Назови удобный день.', best:'Thursday, please.',
    judge(w,mem){ const d=DAY_IN(w);
    if(d){ mem.day=d; return {br:'ok'}; }
    return {huh:1}; },
    tr:{ ok:{them:'Ok, {day} works for me.',ruThem:'Хорошо, {day} мне подходит.',next:'conf'} } },
    wed:{ task:'Скажи, что среда занята, и предложи четверг.', best:'Wednesday is busy for me. Can we do Thursday?',
    judge(w,mem){ const d=DAY_IN(w);
    if(has(w,'thursday')){ mem.day='thursday'; return {br:'thu'}; }
    if(d==='wednesday'&&!has(w,'busy','no','not')){ mem.day='wednesday'; return {br:'wed'}; }
    if(d){ mem.day=d; return {br:'oth'}; }
    if(has(w,'busy','no','not')) return {br:'askd'};
    return {huh:1}; },
    tr:{ thu:{them:'Thursday is fine.',ruThem:'Четверг подходит.',next:'conf'},
      wed:{them:'Great. Wednesday it is.',ruThem:'Отлично, тогда среда.',next:'conf'},
      oth:{them:'Ok, {day} works for me.',ruThem:'Хорошо, {day} подходит.',next:'conf'},
      askd:{them:'I see. What day is good for you?',ruThem:'Ясно. Какой день вам удобен?',next:'day'} } },
    conf:{ task:'Подтверди встречу и назови день.', best:'Great, see you on Thursday.',
    judge(w,mem){ const d=DAY_IN(w);
    if(d){ if(!mem.day||d===mem.day) return {br:'ok'};
      return {br:'fix'}; }
    if(has(w,'sorry','pardon','repeat','again','what')) return {br:'again'};
    return {huh:1}; },
    tr:{ ok:{them:'Great. Is there anything else?',ruThem:'Отлично. Что-нибудь ещё?',next:'any'},
      fix:{them:'Wait, we agreed on {day}.',ruThem:'Стоп, мы договорились на {day}.',next:'conf'},
      again:{them:'So, we meet on {day}, right?',ruThem:'Значит, встречаемся в {day}?',next:'conf'} } },
    any:{ task:'Спроси, когда будет ответ.', best:'When will I know?',
    judge(w){ if(has(w,'no','nothing')) return {br:'done'};
    if(has(w,'when','know','call','hear','answer','soon')) return {br:'ask'};
    return {huh:1}; },
    tr:{ ask:{them:'We will call you this week.',ruThem:'Мы позвоним вам на этой неделе.',next:'wait'},
      done:{them:'Ok. We will call you this week.',ruThem:'Хорошо. Мы позвоним вам на этой неделе.',next:'wait'} } },
    wait:{ task:'Скажи, что будешь ждать звонка.', best:'Thank you, I will wait for your call.',
    judge(w){ if(has(w,'wait','waiting','expect','expecting','forward','hear')) return {br:'wait'};
    return {huh:1}; },
    tr:{ wait:{them:'Thank you for coming.',ruThem:'Спасибо, что пришли.',next:'bye'} } },
    bye:{ task:'Попрощайся вежливо.', best:'Thank you. Have a good day.',
    judge(w){ if(has(w,'bye','goodbye','thanks','thank','day','see','later')) return {br:'ok'}; return {huh:1}; },
    tr:{ ok:{them:'Goodbye!',ruThem:'До свидания!',next:null} } }
    }
};

const SCENES={ s1:S1, s2:S2, s3:S3 };
try{ if(typeof module!=='undefined' && module.exports) module.exports={SCENES}; }catch(e){}

/* ================= UI ================= */
const fmt = s => (s||'').replace(/\{name\}/g, (D.mem && D.mem.name)||'…')
  .replace(/\{day\}/g, (D.mem && D.mem.day) ? cap(D.mem.day) : '…');
const D = {
  mem:{}, scene:null, at:null, tries:0,
  open(id){ D.scene=SCENES[id]; D.again();
    [...document.querySelectorAll('#pick button')].forEach(b=>b.classList.toggle('on',b.dataset.id===id)); },
  again(){ D.mem={}; D.at=D.scene.start; D.tries=0; D._hint=null;
    const chat=document.getElementById('chat'); chat.innerHTML='';
    if(D.scene.intro){ const c=document.createElement('div'); c.className='ctx'; c.textContent=D.scene.intro; chat.appendChild(c); }
    if(D.scene.opener) D.bub('them', D.scene.opener.them, D.scene.opener.ru);
    document.getElementById('out').innerHTML=''; document.getElementById('in').value='';
    document.getElementById('stage').style.display='block';
    document.getElementById('in').disabled=false;
    document.querySelector('.row button').disabled=false;
    D.step(); },
  step(){
    const n=D.scene.nodes[D.at];
    document.getElementById('ru').textContent = n.task;
    document.querySelector('.row button').disabled=false;
    document.getElementById('in').disabled=false;
    document.getElementById('dunno').style.display='';
    document.getElementById('out').innerHTML='';
    if(D._hint){ document.getElementById('out').innerHTML=`<div class="hint">Правильно говорить: «${D._hint}».</div>`; }
  },
  bub(who,en,ru){ const c=document.getElementById('chat');
    [...c.children].forEach(x=>x.classList.add('old'));
    const b=document.createElement('div'); b.className='bub '+who;
    b.innerHTML=en+(ru?`<span class="tr">${ru}</span>`:'');
    c.appendChild(b); c.scrollTop=c.scrollHeight; },
  go(){
    const n=D.scene.nodes[D.at];
    const said=document.getElementById('in').value.trim();
    if(!said) return;
    const w=expand(norm(said));
    D.mem._digits=(said.match(/\d+/g)||[]); D.mem._raw=said;
    let res;
    if(!w.length && !D.mem._digits.length){ res={huh:1, note:/[а-яё]/i.test(said)?'Похоже на русский — попробуй по-английски.':'Пусто.'}; }
    else res=n.judge(w,D.mem);
    document.getElementById('in').value='';
    if(res.huh){
      D.tries++;
      D.bub('you',said,'');
      const out=document.getElementById('out');
      const d=document.getElementById('dunno'); d.style.display='none';
      if(D.tries>=2){
        out.innerHTML=`<div class="v"><b class="a">Собеседник не понял.</b><ul><li>Скажи, например: <b>${n.best}</b></li></ul></div>`;
        D.bub('them','Sorry, I did not understand.','Простите, я не понял.');
        const b=document.createElement('button'); b.className='g'; b.textContent='Дальше';
        b.onclick=()=>{ const w2=expand(norm(n.best)); D.branch(n,n.judge(w2,D.mem)); };
        const row=document.createElement('div'); row.className='row'; row.appendChild(b);
        out.appendChild(row);
        return;
      }
      out.innerHTML=`<div class="v"><b class="a">Собеседник не понял.</b><ul><li>Скажи иначе — или жми «Не знаю».</li></ul></div>`;
      D.bub('them','Sorry, I did not understand. Could you say it again?','Простите, не понял. Повторите, пожалуйста.');
      const b=document.createElement('button'); b.className='g'; b.textContent='Исправить ответ';
      b.onclick=()=>{ b.remove(); out.innerHTML=''; document.getElementById('in').disabled=false;
        document.querySelector('.row button').disabled=false; d.style.display=''; };
      document.querySelector('.row button').disabled=true; document.getElementById('in').disabled=true;
      out.appendChild(b);
      return;
    }
    D.tries=0;
    D.bub('you',said,'');
    D.branch(n,res);
  },
  branch(n,res){
    const tr=n.tr[res.br];
    const out=document.getElementById('out');
    D._hint=(tr&&tr.note)||null;
    const note=D._hint?`<div class="hint">Правильно говорить: «${D._hint}».</div>`:'';
    out.innerHTML='<div class="v"><b class="g">Тебя поняли.</b></div>'+note;
    const d=document.getElementById('dunno'); d.style.display='none';
    document.querySelector('.row button').disabled=true; document.getElementById('in').disabled=true;
    setTimeout(()=>{
      if(!tr){ D.end(); return; }
      D.bub('them', fmt(tr.them), fmt(tr.ruThem));
      if(!tr.next){ D.end(); return; }
      D.at=tr.next; D.step();
    }, 700);
  },
  opts(){
    const n=D.scene.nodes[D.at];
    document.getElementById('dunno').style.display='none';
    const out=document.getElementById('out');
    out.innerHTML='<div class="v"><b class="a">Как сказать</b></div>';
    const row=document.createElement('div'); row.className='row';
    const b=document.createElement('button'); b.className='g'; b.textContent=n.best;
    b.onclick=()=>{ row.remove(); const w=expand(norm(n.best)); D.bub('you',n.best,''); D.branch(n,n.judge(w,D.mem)); };
    row.appendChild(b); out.appendChild(row);
  },
  end(){
    document.getElementById('ru').textContent='—';
    const d=document.getElementById('dunno'); d.style.display='none';
    document.querySelector('.row button').disabled=true;
    document.getElementById('in').disabled=true;
    const out=document.getElementById('out');
    out.innerHTML=`<div class="note-end">Сцена завершена.</div>
      <div class="v"><ul><li>Пройди ещё раз с другим ответом — собеседник среагирует иначе.</li></ul></div>`;
  }
};
(function init(){
  const pick=document.getElementById('pick');
  Object.keys(SCENES).forEach(id=>{
    const b=document.createElement('button'); b.dataset.id=id; b.textContent=SCENES[id].title;
    b.onclick=()=>D.open(id); pick.appendChild(b);
  });
  D.scene=S1; D.open('s1');
})();
</script></body></html>
