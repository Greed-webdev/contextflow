<script>
/* ================= ЯДРО (без DOM) ================= */
/* ---------- помощники ветвящихся диалогов (variant:'flow') ----------
   Перенесены из эталона демо-5: единый стоп-лист имён, белый список,
   правдоподобие, числа. Судьи узлов в lessons.js зовут их по имени —
   поэтому они объявлены глобально, как в демо. */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = t => (t||'').toLowerCase().replace(/[\u2019']/g,"'").replace(/[^a-z' ]/g,' ').split(/\s+/).filter(Boolean);
const EXP={"i'm":['i','am'],"it's":['it','is'],"don't":['do','not'],"can't":['can','not'],"i've":['i','have'],
"what's":['what','is'],"i'll":['i','will'],"there's":['there','is'],"we're":['we','are'],"you're":['you','are'],
"that's":['that','is'],"doesn't":['does','not'],"isn't":['is','not'],"won't":['will','not'],
"didn't":['did','not'],"wasn't":['was','not'],"weren't":['were','not'],"haven't":['have','not'],
"hasn't":['has','not'],"hadn't":['had','not'],"couldn't":['could','not'],"shouldn't":['should','not'],
"wouldn't":['would','not'],"mustn't":['must','not'],"aren't":['are','not'],"they're":['they','are'],"i'd":['i','would']};
const expand = a => { const o=[]; a.forEach(x=>{ if(EXP[x]) o.push(...EXP[x]); else o.push(x.replace(/'/g,'')); }); return o; };
const NUM={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,
thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,
fifty:50,sixty:60,seventy:70,eighty:80,ninety:90,hundred:100};
const numOf = a => { let tot=0,cur=0,any=false; a.forEach(x=>{ if(/^\d+$/.test(x)){tot+=parseInt(x,10);any=true;return;}
  if(x in NUM){any=true;cur+=NUM[x];} }); return any?tot+cur:null; };
const has = (w,...xs)=> xs.some(x=>w.includes(x));
/* Близкое отрицание: «no/not/never/cannot» в 1–3 словах ПЕРЕД цель-словом,
   служебные пропускаются. Звать ДО позитивных проверок в каждом судье.
   «I do miss them» — не отрицание (между do и miss нет not). */
const NEG_LEAD=['no','not','never','cannot'];
const NEG_SKIP=['to','a','an','the','on','in','at','from','want','wants','have','has','had','do','does','did',
'will','would','can','could','shall','should','am','is','are','be','been','really','just','very','so','think',
'any','some','plan','plans','planning','going','intention','like','hope','live','lives','living','stay','stays','staying',
'need','needs','take','order','want','wants'];
const negatedWord=(w,i)=>{ let k=i-1,steps=0;
  while(k>=0&&steps<3){ const x=w[k];
    if(NEG_LEAD.includes(x)) return true;
    if(!NEG_SKIP.includes(x)) return false;
    k--; steps++; }
  return false; };
const isNegatedIntent=(w,targets)=>{ for(let i=0;i<w.length;i++){ if(targets.includes(w[i])&&negatedWord(w,i)) return true; } return false; };
/* Отказ от имени: «X is not my name», «that is not my real name», «I am not X».
   Звать ДО любого извлечения имени — если имя отрицается, возвращать переспрос. */
const deniesName = w => {
  for (let i=0;i<w.length-1;i++){
    if(w[i]==='is'&&w[i+1]==='not'){
      const tail=w.slice(i+2,i+6);
      if(tail.includes('name')) return true; /* X is not my (real) name */
    }
  }
  for (let i=0;i<w.length-3;i++){
    if(w[i]==='i'&&w[i+1]==='am'&&w[i+2]==='not'){
      const x=w[i+3];
      /* только уверенные имена: иначе «i am not late / not here» ложно отрицало имя */
      if(x&&NAME_OK.has(x)&&!NOT_NAME.has(x)) return true; /* I am not Petrova */
    }
  }
  return false; };
/* Имя из явного представления: «my name is X [Y]», «i am X», «i'm X», «call me X».
   Возвращает до двух слов (имя + фамилия). После «my name is» берёт даже
   стоп-слова (Hope, Will, May — живые имена); после «i am» — только белый список. */
const introNames = w => {
  for (let i=0;i<w.length;i++){
    const a=w[i], b=w[i+1];
    let strong=false, j=-1;
    if(a==='name'&&b==='is'){ strong=true; j=i+2; }
    else if(a==='call'&&b==='me'){ strong=true; j=i+2; }
    else if(a==='this'&&b==='is'){ strong=true; j=i+2; }
    else if(a==='surname'&&b==='is'){ strong=true; j=i+2; }
    else if(a==='family'&&b==='name'&&w[i+2]==='is'){ strong=true; j=i+3; }
    else if((a==='i'&&b==='am')||a==='im'){ j=(a==='im')?i+1:i+2; }
    if(j<0) continue;
    const ok=x=>x&&/^[a-z']+$/.test(x)&&x.length>=2&&x.length<=15
       &&!NEG_LEAD.includes(x)&&!NOT_NAME.has(x)&&!NUM.hasOwnProperty(x)
       &&(NAME_OK.has(x)||(strong&&!NAME_STOP.includes(x)&&!SVC.includes(x)&&looksLikeName(x)));
    if(w[j]&&NEG_LEAD.includes(w[j])) return []; /* «my name is not ...» */
    if(!ok(w[j])) continue;
    const out=[w[j]];
    if(ok(w[j+1])) out.push(w[j+1]);
    return out;
  }
  return []; };
const SVC=['a','an','the','to','of','and','my','i','you','it','in','on','at','for','with','this','that','have',
'has','can','will','would','please','me','we','they','is','am','are','be','do','does','did','not','no','yes',
'thanks','thank','goodbye','bye','see','very','much','really','sorry','right','ok','okay','sure','here',
'there','now','then','good','fine','great','nice','just','about','all','too','also','up','down','left',
'day','night','back','soon','later','again','more','some','any','lot','so','but','or','if','from','out'];
const NAME_STOP=['hi','hello','hey','good','morning','afternoon','evening','late','sorry','excuse','waiting','wait',
'leaving','looking','sir','madam','maam','mr','mrs','ms','miss','there','from','with','about','name','my','me','i',
'am','im','please','nice','to','meet','meeting','appointment','help','need','friend','lost','person','someone','just','call',
'no','not','thanks','thank','fine','nothing','bye','goodbye','see','later','today','sure','yes','yeah','have','has',
'an','a','the','for','here','what','your','can','you','may','of','course','going','home','go','it','problem','worries',
'worry','know','yet','hope','matter','room','floor','lift','ok','okay','come','coming','visit','back','now','then',
'right','left','after','before','so','but','or','and','too','also','only','very','much','really','again','soon','day',
'do','does','did','is','are','be','we','they','this','that','these','those','all','any','some','more','out','if','at',
'on','in','up','down','an','a'];
const NAME_OK=new Set(['anna','anne','ann','maria','marie','mary','kate','katie','john','jane','tom','tim','sam',
'alex','max','nick','mike','peter','paul','david','daniel','james','robert','george','helen','laura','julia',
'olivia','emma','sophie','sofia','clara','lucy','sarah','rachel','ruth','grace','faith','hope','may','june',
'rose','lily','iris','ruby','pearl','olive','daisy','amber','joy','dawn','summer','wren','eve','ivy','ada',
'mark','frank','miles','ray','will','jack','ben','matt','rob','bill','joe','leo','hugo','oscar','felix',
'masha','maria','ekaterina','katya','sasha','dasha','nastya','olga','svetlana','sveta','natasha','natalia',
'irina','ira','tatiana','tanya','lyudmila','oksana','yulia','julia','alyona','ksenia','vera','nadezhda',
'nadya','lyubov','galina','zinaida','zhanna','elizaveta','liza','margarita','rita','polina','arina','sonya',
'dmitry','dima','sergey','seryozha','andrey','alexey','lyosha','nikolay','kolya','vladimir','vova','mikhail',
'misha','evgeny','zhenya','igor','oleg','boris','artyom','timur','ruslan','vadim','lev','ivan','vanya',
'pavel','pasha','denis','egor','yaroslav','stanislav','vyacheslav','anatoly','gennady','valery','arkady',
'roman','roma','kirill','nikita','anton','maxim','stepan','fyodor','grigory','konstantin','viktor','yuri',
'petrova','ivanova','sokolova','smirnov','popov','kuznetsov','brown','smith','jones','wilson','taylor']);
const NOT_NAME=new Set(['banana','pizza','apple','orange','potato','tomato','burger','coffee','water','bread',
'cat','dog','fish','bird','horse','mouse','table','chair','door','window','book','phone','car','house','tree',
'lorem','ipsum','dolor','test','testing','asdf','asdfgh','qwerty','xyz','abc','blah','hmm','uh','um','eh',
'why','who','when','where','which','because','maybe','nothing','something','anything','everything','nobody',
'fuck','fucking','shit','damn','bitch','ass','crap','hell','idiot','stupid']);
const looksLikeName = x =>
  x.length>=2 && x.length<=15 &&
  /^[a-z']+$/.test(x) &&
  /[aeiouy]/.test(x) &&
  !/(.)\1\1/.test(x) &&
  !/[bcdfghjklmnpqrstvwxz]{4}/.test(x) &&
  !/(ing|ed|ly|tion|ness|ment)$/.test(x);
const cap = x => x.charAt(0).toUpperCase()+x.slice(1);
const pickName = (w, skip, strict)=>{
  for(let i=0;i<w.length-1;i++){
    const pair=(w[i]==='name'&&w[i+1]==='is')||(w[i]==='i'&&w[i+1]==='am')||
               (w[i]==='call'&&w[i+1]==='me')||(w[i]==='this'&&w[i+1]==='is');
    if(pair){ const x=w[i+2];
      const strong=(w[i]==='name'&&w[i+1]==='is')||(w[i]==='call'&&w[i+1]==='me')||(w[i]==='this'&&w[i+1]==='is');
      if(x&&NEG_LEAD.includes(x)) return null; /* «my name is not ...» — имя не названо */
      /* после «my name is» берём даже стоп-слова (Hope, Will, May);
         после «i am» — только белый список, иначе «i am late/here» становилось именем */
      if(x&&!NOT_NAME.has(x)&&!NUM.hasOwnProperty(x)&&
         (NAME_OK.has(x)||(strong&&!NAME_STOP.includes(x)&&looksLikeName(x)))) return cap(x); }
  }
  const s=new Set([...SVC,...skip]);
  const c=w.find(x=>{
    if(s.has(x)||NUM.hasOwnProperty(x)||NOT_NAME.has(x)) return false;
    if(NAME_OK.has(x)) return true;
    return strict ? false : looksLikeName(x);
  });
  return c ? cap(c) : null;
};
const introduced = w => {
  for(let i=0;i<w.length-1;i++){
    if(w[i]==='name'&&w[i+1]==='is') return true;
    if(w[i]==='i'&&w[i+1]==='am') return true;
    if(w[i]==='call'&&w[i+1]==='me') return true;
    if(w[i]==='this'&&w[i+1]==='is') return true;
  }
  return false;
};
const sigWords = (w, extra)=>{
  const ex = extra || [];
  return w.filter(x=> x.length>1 && !SVC.includes(x) && !ex.includes(x));
};
/* --- помощники судей ветвящихся диалогов (партия 2, синхронизировано с демо-6) --- */
const DAY_IN = w => {
  const D=['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
  for (let i=0;i<w.length;i++) if (D.includes(w[i]) && !negatedWord(w,i)) return w[i]; /* отрицанный день не берём */
  return null;
};
const FLOWNUM = (w, digits) => {
  if (digits && digits.length === 1) return digits[0];
  if (digits && digits.length > 1) return null;
  const seq = [];
  w.forEach(x => { if (x in NUM) seq.push(x); });
  if (!seq.length) return null;
  let cur = 0;
  for (const x of seq) {
    const v = NUM[x];
    if (x === 'hundred' || x === 'thousand'){ cur = cur ? cur * v : v; }
    else if (cur === 0) cur = v;
    else if (cur % 10 === 0 && cur < 100 && v < 10) cur += v;
    else if (cur >= 100 && v < 100) cur += v;
    else return null;
  }
  return cur;
};
const NEGLEAD=['no','not','never','without'];
const NEGPASS=['to','a','an','the','and','or','any','it','this','that','one','really','just','very','so',
'want','need','take','have','get','choose','prefer','buy','think','do','does','did',
'would','will','can','could','should','am','is','are','be','like','likes','liked','wants'];
const negatedAt = (w,i) => {
  for (let j=0;j<w.length;j++){
    if(!NEGLEAD.includes(w[j])) continue;
    let k=j+1;
    while(k<i && NEGPASS.includes(w[k])) k++;
    if(k===i) return true;
  }
  return false;
};
const chose = (w,...xs) => { for (const x of xs){ const i=w.indexOf(x); if(i>-1 && !negatedAt(w,i)) return true; } return false; };

const S1 = { title:"В аптеке · ур. 40", start:'need',

const S2 = { title:"Регистрация после приезда · ур. 7", start:'appoint',

          yes:{them:'Good. Your passport and your papers, please.',ruThem:'Хорошо. Ваш паспорт и документы, пожалуйста.',next:'docs'},
          no:{them:'Oh. Please take a ticket and wait - it may take some time.',ruThem:'Ой. Возьмите, пожалуйста, талон и подождите — это может занять время.',next:'ticket'} } },
      ticket:{ task:'Согласись подождать — или скажи, что придёшь завтра.', best:'Ok, I will wait.',
        judge(w){
          if(has(w,'tomorrow','later','another','next','come back','back')) return {br:'tomorrow'};
          if(has(w,'wait','ok','okay','yes','yeah','sure','fine','ticket','sit','time')) return {br:'wait'};
          return {huh:1}; },
        tr:{
          wait:{them:'Take a seat, please. Next, please! Your passport and your papers.',ruThem:'Присядьте, пожалуйста. Следующий! Ваш паспорт и документы.',next:'docs'},
          tomorrow:{them:'Of course. We open at nine in the morning.',ruThem:'Конечно. Мы открываемся в девять утра.',next:'leave'} } },
      leave:{ task:'Попрощайся.', best:'Ok. See you tomorrow.',
        judge(w){
          if(has(w,'bye','goodbye','ok','okay','thanks','thank','see','tomorrow','day','sure','nine','morning','will')) return {br:'ok'};
          return {huh:1}; },
        tr:{ ok:{them:'Goodbye!',ruThem:'До свидания!',next:null} } },
      docs:{ task:'Ответь, есть ли у тебя подтверждение адреса (например: договор аренды / письмо из банка).', best:'Yes, here is my rental contract.',
        judge(w){
          if(has(w,'forgot','lost','left')) return {br:'no'};
          if((has(w,'no','not'))&&!has(w,'yes','here','have','sure','course')) return {br:'no'};
          if(has(w,'yes','yeah','here','have','contract','rent','rental','bank','letter','bill','paper','sure','course','document','address')) return {br:'yes'};
          return {huh:1}; },
        tr:{
          yes:{them:'Thank you. The fee is fifty euros. Cash or card?',ruThem:'Спасибо. Сбор — пятьдесят евро. Наличными или картой?',next:'fee'},
          no:{them:'We need a paper with your address: a rental contract or a bank letter. Please bring it.',ruThem:'Нам нужна бумага с вашим адресом: договор аренды или письмо из банка. Принесите её, пожалуйста.',next:'leave'} } },
      fee:{ task:'Скажи, как оплатишь сбор (картой или наличными).', best:'By card, please.',
        judge(w,mem){
          if(has(w,'card','cards')) return {br:'card'};
          if(has(w,'cash','money','coins','notes')) return {br:'cash'};
          if((mem._digits||[]).length) return {br:'cash'};
          return {huh:1}; },
        tr:{
          card:{them:'Thank you. All paid.',ruThem:'Спасибо. Оплачено.',next:'when'},
          cash:{them:'Thank you. Here is your receipt.',ruThem:'Спасибо. Вот ваш чек.',next:'when'} } },
      when:{ task:'Спроси, когда будет готова карточка (или скажи, что вопросов нет).', best:'When will my card be ready?',
        judge(w){
          if(has(w,'nothing','all','enough')) return {br:'none'};
          if(has(w,'no','not')&&w.length<=3) return {br:'none'}; /* «вопросов нет» */
          if(has(w,'ready','when','card','time','long','soon','days','weeks')) return {br:'ok'};
          if(has(w,'what','where','how','why','can','do','does','is','are')) return {br:'ok'};
          return {huh:1}; },
        tr:{
          ok:{them:'In about two weeks. We will send a letter to your address.',ruThem:'Примерно через две недели. Мы отправим письмо на ваш адрес.',next:'notify'},
          none:{them:'Then that is all. Have a nice day!',ruThem:'Тогда это всё. Хорошего дня!',next:'bye'} } },
      notify:{ task:'Уточни про уведомление: как узнаешь, что всё готово.', best:'Will you send me a message?',
        judge(w){
          if(has(w,'letter','message','call','phone','send','know','notify','contact','email','how','when','come','pick','get')) return {br:'ok'};
          return {huh:1}; },
        tr:{ ok:{them:'Yes, a letter to your address. Bring it with you when you come for the card.',ruThem:'Да, письмо на ваш адрес. Принесите его, когда придёте за карточкой.',next:'bye'} } },
      bye:{ task:'Попрощайся вежливо.', best:'Thank you. Goodbye.',
        judge(w){
          if(has(w,'bye','goodbye','thanks','thank','see','later','day','you','too','nice')) return {br:'ok'};
          return {huh:1}; },
        tr:{ ok:{them:'Goodbye! Welcome to the country.',ruThem:'До свидания! Добро пожаловать в страну.',next:null} } }
        }};
const S3 = { title:"СИМ-карта и контракт · ур. 15", start:'need',
        intro:'Салон связи. Нужна связь как можно скорее: без неё не работает ничего.',
        opener:{them:'Hi there! Can I help you?', ru:'Привет! Могу чем-то помочь?'},
        nodes:{
      need:{ task:'Скажи, что тебе нужно (например: сим-карта / домашний интернет).', best:'I need a SIM card, please.',
        judge(w){
          if(has(w,'internet','wifi','wi-fi','home','broadband','router')) return {br:'net'};
          if(has(w,'sim','card','number','phone','mobile','data','tariff','plan')) return {br:'sim'};
          return {huh:1}; },
        tr:{
          sim:{them:'Of course. Prepaid or a monthly plan?',ruThem:'Конечно. Предоплата или месячный план?',next:'plan'},
          net:{them:'For home internet I need your address. Do you know your postcode?',ruThem:'Для домашнего интернета нужен ваш адрес. Знаете свой почтовый индекс?',next:'addr'} } },
      plan:{ task:'Выбери: предоплата или контракт на месяц.', best:'Prepaid, please.',
        judge(w){
          if(has(w,'prepaid','pre-paid','pay','first','start','simple','no contract')) return {br:'prepaid'};
          if(has(w,'monthly','contract','plan','unlimited','month','more','big')) return {br:'contract'};
          return {huh:1}; },
        tr:{
          prepaid:{them:'Good choice. It is twenty euros for ten gigabytes.',ruThem:'Хороший выбор. Десять гигабайт за двадцать евро.',next:'pay'},
          contract:{them:'For a contract I need your passport. Do you have it?',ruThem:'Для контракта нужен ваш паспорт. Он у вас есть?',next:'pass'} } },
      pass:{ task:'Ответь, есть ли у тебя паспорт.', best:'Yes, here it is.',
        judge(w){
          if(has(w,'forgot','lost','left')) return {br:'no'};
          if(has(w,'no','not')&&!has(w,'yes','here','have','sure','course')) return {br:'no'};
          if(has(w,'yes','yeah','here','have','passport','sure','course')) return {br:'yes'};
          return {huh:1}; },
        tr:{
          yes:{them:'Great. Sign here, please. Your plan starts today.',ruThem:'Отлично. Распишитесь здесь, пожалуйста. План начинает действовать сегодня.',next:'pay'},
          no:{them:'No problem. Take a prepaid SIM for now - no passport needed.',ruThem:'Без проблем. Возьмите пока сим-карту с предоплатой — паспорт не нужен.',next:'pay'} } },
      addr:{ task:'Скажи, что знаешь адрес, — или спроси, есть ли покрытие у твоего дома.', best:'Yes, I know my postcode.',
        judge(w,mem){
          if((mem._digits||[]).length) return {br:'ok'}; /* назвал индекс цифрами */
          if(has(w,'yes','yeah','know','sure','here','ok','okay')) return {br:'ok'};
          if(has(w,'no','not','check','coverage','area','where','work')) return {br:'check'};
          return {huh:1}; },
        tr:{
          ok:{them:'Good, we cover your area. It is thirty euros a month, no contract.',ruThem:'Хорошо, ваш район покрыт. Тридцать евро в месяц, без контракта.',next:'pay'},
          check:{them:'We cover almost everywhere. The first month is free to try.',ruThem:'Мы покрываем почти везде. Первый месяц — бесплатно, на пробу.',next:'pay'} } },
      pay:{ task:'Оплати покупку.', best:'Here you are.',
        judge(w,mem){
          if(has(w,'here','there','take','please','ok','okay','yes','yeah','sure','fine','card','cash','pay')) return {br:'ok'};
          if((mem._digits||[]).length) return {br:'ok'};
          return {huh:1}; },
        tr:{ ok:{them:'Thank you. Here is your SIM - your new number is on the card.',ruThem:'Спасибо. Вот ваша сим-карта — новый номер написан на карточке.',next:'activate'} } },
      activate:{ task:'Спроси, как её активировать (или скажи, что вопросов нет).', best:'How do I activate it?',
        judge(w){
          if(has(w,'nothing','all','enough','thanks','thank')) return {br:'none'};
          if(has(w,'no','not')&&w.length<=3) return {br:'none'};
          if(has(w,'activate','start','work','how','use','when','ready','put','restart','help')) return {br:'ok'};
          return {huh:1}; },
        tr:{
          ok:{them:'Put it in your phone and restart it. It works in two minutes.',ruThem:'Вставьте её в телефон и перезагрузите. Через две минуты заработает.',next:'bye'},
          none:{them:'Great. Enjoy!',ruThem:'Отлично. Пользуйтесь!',next:'bye'} } },
      bye:{ task:'Попрощайся.', best:'Thank you. Bye.',
        judge(w){
          if(has(w,'bye','goodbye','thanks','thank','see','later','day','you','too','nice','great')) return {br:'ok'};
          return {huh:1}; },
        tr:{ ok:{them:'Bye! Come back if you need anything.',ruThem:'Пока! Заходите, если что-то понадобится.',next:null} } }
        }};
const SCENES={ s1:S1, s2:S2, s3:S3 };
try{ if(typeof module!=='undefined' && module.exports) module.exports={SCENES}; }catch(e){}

/* ================= UI ================= */
const fmt = s => (s||'').replace(/\{name\}/g, (D.mem && D.mem.name)||'…')
  .replace(/\{day\}/g, (D.mem && D.mem.day) ? cap(D.mem.day) : '…');
const D = {
  mem:{}, scene:null, at:null, tries:0,
  open(id){ D.scene=SCENES[id]; D.again();
    [...document.querySelectorAll('#pick button')].forEach(b=>b.classList.toggle('on',b.dataset.id===id)); },
  again(){ D.mem={}; D.at=D.scene.start; D.tries=0; D._hint=null;
    const chat=document.getElementById('chat'); chat.innerHTML='';
    if(D.scene.intro){ const c=document.createElement('div'); c.className='ctx'; c.textContent=D.scene.intro; chat.appendChild(c); }
    if(D.scene.opener) D.bub('them', D.scene.opener.them, D.scene.opener.ru);
    document.getElementById('out').innerHTML=''; document.getElementById('in').value='';
    document.getElementById('stage').style.display='block';
    document.getElementById('in').disabled=false;
    document.querySelector('.row button').disabled=false;
    D.step(); },
  step(){
    const n=D.scene.nodes[D.at];
    document.getElementById('ru').textContent = n.task;
    document.querySelector('.row button').disabled=false;
    document.getElementById('in').disabled=false;
    document.getElementById('dunno').style.display='';
    document.getElementById('out').innerHTML='';
    if(D._hint){ document.getElementById('out').innerHTML=`<div class="hint">Правильно говорить: «${D._hint}».</div>`; }
  },
  bub(who,en,ru){ const c=document.getElementById('chat');
    [...c.children].forEach(x=>x.classList.add('old'));
    const b=document.createElement('div'); b.className='bub '+who;
    b.innerHTML=esc(en)+(ru?`<span class="tr">${esc(ru)}</span>`:'');
    c.appendChild(b); c.scrollTop=c.scrollHeight; },
  go(){
    const n=D.scene.nodes[D.at];
    const said=document.getElementById('in').value.trim();
    if(!said) return;
    const w=expand(norm(said));
    D.mem._digits=(said.match(/\d+/g)||[]); D.mem._raw=said;
    let res;
    if(!w.length && !D.mem._digits.length){ res={huh:1, note:/[а-яё]/i.test(said)?'Похоже на русский — попробуй по-английски.':'Пусто.'}; }
    else res=n.judge(w,D.mem);
    document.getElementById('in').value='';
    if(res.huh){
      D.tries++;
      D.bub('you',said,'');
      const out=document.getElementById('out');
      if(D.tries>=2){
        document.getElementById('dunno').style.display='none';
        out.innerHTML=`<div class="v"><b class="a">Собеседник не понял.</b><ul><li>Скажи, например: <b>${n.best}</b></li></ul></div>`;
        D.bub('them','Sorry, I did not understand.','Простите, я не понял.');
        const b=document.createElement('button'); b.className='g'; b.textContent='Дальше';
        b.onclick=()=>{ const w2=expand(norm(n.best)); D.branch(n,n.judge(w2,D.mem)); };
        const row=document.createElement('div'); row.className='row'; row.appendChild(b);
        out.appendChild(row);
        return;
      }
      out.innerHTML=`<div class="v"><b class="a">Собеседник не понял.</b><ul><li>Скажи иначе — или жми «Не знаю».</li></ul></div>`;
      D.bub('them','Sorry, I did not understand. Could you say it again?','Простите, не понял. Повторите, пожалуйста.');
      const b=document.createElement('button'); b.className='g'; b.textContent='Исправить ответ';
      b.onclick=()=>{ b.remove(); out.innerHTML=''; document.getElementById('in').disabled=false;
        document.querySelector('.row button').disabled=false; d.style.display=''; };
      document.querySelector('.row button').disabled=true; document.getElementById('in').disabled=true;
      out.appendChild(b);
      return;
    }
    D.tries=0;
    D.bub('you',said,'');
    D.branch(n,res);
  },
  branch(n,res){
    const tr=n.tr[res.br];
    const out=document.getElementById('out');
    D._hint=(tr&&tr.note)||null;
    const note=D._hint?`<div class="hint">Правильно говорить: «${D._hint}».</div>`:'';
    out.innerHTML='<div class="v"><b class="g">Тебя поняли.</b></div>'+note;
    const d=document.getElementById('dunno'); d.style.display='none';
    document.querySelector('.row button').disabled=true; document.getElementById('in').disabled=true;
    setTimeout(()=>{
      if(!tr){ D.end(); return; }
      D.bub('them', fmt(tr.them), fmt(tr.ruThem));
      if(!tr.next){ D.end(); return; }
      D.at=tr.next; D.step();
    }, 700);
  },
  opts(){
    const n=D.scene.nodes[D.at];
    document.getElementById('dunno').style.display='none';
    const out=document.getElementById('out');
    out.innerHTML='<div class="v"><b class="a">Как сказать</b></div>';
    const row=document.createElement('div'); row.className='row';
    const b=document.createElement('button'); b.className='g'; b.textContent=n.best;
    b.onclick=()=>{ row.remove(); const w=expand(norm(n.best)); D.bub('you',n.best,''); D.branch(n,n.judge(w,D.mem)); };
    row.appendChild(b); out.appendChild(row);
  },
  end(){
    document.getElementById('ru').textContent='—';
    const d=document.getElementById('dunno'); d.style.display='none';
    document.querySelector('.row button').disabled=true;
    document.getElementById('in').disabled=true;
    const out=document.getElementById('out');
    out.innerHTML=`<div class="note-end">Сцена завершена.</div>
      <div class="v"><ul><li>Пройди ещё раз с другим ответом — собеседник среагирует иначе.</li></ul></div>`;
  }
};
(function init(){
  const pick=document.getElementById('pick');
  Object.keys(SCENES).forEach(id=>{
    const b=document.createElement('button'); b.dataset.id=id; b.textContent=SCENES[id].title;
    b.onclick=()=>D.open(id); pick.appendChild(b);
  });
  D.scene=S1; D.open('s1');
})();
</script></body></html>
